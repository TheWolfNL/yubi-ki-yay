name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install wails3
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${version}"

      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          plutil -replace CFBundleShortVersionString -string "$version" build/darwin/Info.plist
          plutil -replace CFBundleVersion -string "$version" build/darwin/Info.plist

      - name: Build universal app
        run: wails3 task darwin:package:universal

      - name: Sign and zip
        run: |
          app="bin/Yubi Ki-Yay.app"
          zip="Yubi-Ki-Yay-${VERSION}-universal.zip"
          rm -rf "$app"
          mv bin/yubi-ki-yay.app "$app"
          lipo "$app/Contents/MacOS/yubi-ki-yay" -verify_arch arm64 x86_64
          codesign --force --deep -s - "$app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "$zip"
          shasum -a 256 "$zip" | tee "$zip.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="Yubi-Ki-Yay-${VERSION}-universal.zip"
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          awk -v head="## $GITHUB_REF_NAME (" 'index($0, head) == 1 { f = 1; next } f && /^## / { exit } f && (NF || seen) { seen = 1; print }' CHANGELOG.md > notes.md || true
          if ! grep -q . notes.md; then
            git log --no-merges --format="- %s" "${prev:+$prev..}$GITHUB_REF_NAME" > notes.md
          fi
          if [ -n "$prev" ]; then
            printf "\n**Full changelog:** https://github.com/%s/compare/%s...%s\n" "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> notes.md
          fi
          gh release create "$GITHUB_REF_NAME" "$zip" "$zip.sha256" \
            --title "Yubi Ki-Yay ${VERSION}" --notes-file notes.md

      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "::notice::TAP_DISPATCH_TOKEN not set, skipping cask bump"; exit 0; }
          GH_TOKEN="$TAP_TOKEN" gh api repos/TheWolfNL/homebrew-tap/dispatches \
            -f event_type=bump-cask -f 'client_payload[cask]=yubi-ki-yay' -f "client_payload[version]=${VERSION}"
